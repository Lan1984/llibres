<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llibres — Col·lecció Ortín-Escudé</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23f6f1e6'/%3E%3Crect x='6' y='6' width='68' height='68' fill='none' stroke='%231a1814' stroke-width='2'/%3E%3Ctext x='40' y='51' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%231a1814'%3EOE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────────────────────
       Col·lecció Ortín-Escudé — Llibres
       ───────────────────────────────────────────────────────────── */

    :root {
      --paper:        oklch(0.972 0.012 82);
      --paper-deep:   oklch(0.945 0.018 82);
      --ink:          #1a1814;
      --ink-soft:     #4a463f;
      --ink-muted:    #8a8478;
      --rule:         oklch(0.88 0.012 82);
      --accent:       oklch(0.48 0.06 55); /* terracota apagada */
      --serif:        "Cormorant Garamond", "EB Garamond", Georgia, serif;
      --sans:         "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:         "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── Header ──────────────────────────────────────────────── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in oklab, var(--paper) 92%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }
    .site-header__inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .site-header__nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .site-header__nav a { transition: color 0.2s; }
    .site-header__nav a:hover,
    .site-header__nav a.is-active { color: var(--ink); }

    /* ─── Logo ────────────────────────────────────────────────── */
    .logo { display: flex; align-items: center; gap: 14px; color: var(--ink); }
    .logo__mark { width: 38px; height: 38px; flex-shrink: 0; }
    .logo__name {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    /* ─── Estat (càrrega / error) ────────────────────────────── */
    .status {
      max-width: 1320px;
      margin: 0 auto;
      padding: 120px 40px;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 20px;
      color: var(--ink-muted);
    }

    /* ─── Biblioteca — cerca + graella ───────────────────────── */
    .library {
      max-width: 1320px;
      margin: 0 auto;
      padding: 40px 40px 0;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--ink);
      padding: 6px 0 10px;
      margin-bottom: 20px;
    }
    .search svg { flex-shrink: 0; color: var(--ink-muted); }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font-family: var(--serif);
      font-size: 24px;
      color: var(--ink);
      outline: none;
      padding: 0;
    }
    .search input::placeholder { color: var(--ink-muted); font-style: italic; }
    .search input::-webkit-search-cancel-button { display: none; }
    .link-btn {
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: none;
      border: 0;
      padding: 0 0 2px;
      border-bottom: 1px solid var(--ink-muted);
      cursor: pointer;
    }
    .link-btn:hover { color: var(--ink); }
    .library__count {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 32px 0;
    }
    .empty {
      padding: 80px 0;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 20px;
      color: var(--ink-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 48px 32px;
    }
    .book { display: flex; flex-direction: column; gap: 14px; }
    .book__cover {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: var(--paper-deep);
      box-shadow: 0 1px 2px rgba(26, 24, 20, 0.12), 0 6px 16px rgba(26, 24, 20, 0.08);
      transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.4s;
    }
    .book:hover .book__cover {
      transform: translateY(-4px);
      box-shadow: 0 2px 4px rgba(26, 24, 20, 0.12), 0 14px 28px rgba(26, 24, 20, 0.12);
    }
    .book__cover img { width: 100%; height: 100%; object-fit: cover; }
    .book__title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 19px;
      line-height: 1.15;
      margin: 0 0 4px 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book__author {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-soft);
      margin: 0 0 10px 0;
    }
    .book__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .book__rating { margin-top: 10px; line-height: 1; }

    /* ─── Placeholder de portada ─────────────────────────────── */
    .no-cover {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18% 12% 10%;
      border-left: 6px solid rgba(26, 24, 20, 0.12);
      color: var(--ink);
    }
    .no-cover__title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
      line-height: 1.1;
      text-wrap: balance;
    }
    .no-cover__author {
      font-family: var(--serif);
      font-style: italic;
      font-size: 14px;
      color: var(--ink-soft);
      margin-top: 10px;
    }
    .no-cover__label {
      font-size: 8.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .no-cover--0 { background: oklch(0.93 0.025 82); }
    .no-cover--1 { background: oklch(0.90 0.03 60); }
    .no-cover--2 { background: oklch(0.91 0.02 140); }
    .no-cover--3 { background: oklch(0.90 0.018 240); }
    .no-cover--4 { background: oklch(0.89 0.035 45); }

    /* ─── Badges i estrelles ─────────────────────────────────── */
    .badge {
      display: inline-block;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 4px 8px 3px;
      line-height: 1.2;
      border: 1px solid transparent;
    }
    .badge--llegit  { border-color: var(--ink); color: var(--ink); }
    .badge--llegint { background: var(--accent); color: var(--paper); }
    .badge--pendent { background: var(--rule); color: var(--ink-soft); }

    .stars {
      position: relative;
      display: inline-block;
      font-size: 13px;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--rule);
    }
    .stars__fill {
      position: absolute;
      inset: 0 auto 0 0;
      overflow: hidden;
      white-space: nowrap;
      color: var(--accent);
    }

    /* ─── Carrega'n més ──────────────────────────────────────── */
    .more { display: flex; justify-content: center; padding: 64px 0 0; }
    .more__end {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .sentinel { height: 1px; }

    /* ─── Detall d'un llibre ─────────────────────────────────── */
    .detail {
      max-width: 1320px;
      margin: 0 auto;
      padding: 64px 40px 120px;
    }
    .detail__back {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 56px;
    }
    .detail__back:hover { color: var(--ink); }
    .detail__header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 56px;
    }
    .detail__eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--ink-muted);
      margin: 0 0 18px 0;
      text-transform: uppercase;
    }
    .detail__title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(36px, 4.6vw, 64px);
      line-height: 1.04;
      letter-spacing: -0.012em;
      margin: 0 0 14px 0;
      text-wrap: balance;
    }
    .detail__author {
      font-family: var(--serif);
      font-style: italic;
      font-size: 21px;
      color: var(--ink-soft);
      margin: 0;
    }
    .detail__year {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 300;
      color: var(--ink-muted);
      line-height: 1;
    }
    .detail__body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 80px;
      align-items: start;
    }
    .detail__cover {
      max-width: 420px;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: var(--paper-deep);
      box-shadow: 0 2px 4px rgba(26, 24, 20, 0.12), 0 18px 40px rgba(26, 24, 20, 0.12);
    }
    .detail__cover img { width: 100%; height: 100%; object-fit: cover; }
    .detail__cover .no-cover__title { font-size: 32px; }
    .detail__cover .no-cover__author { font-size: 19px; }
    .detail__cover .no-cover__label { font-size: 10px; }
    .detail__status { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .detail__status .stars { font-size: 18px; }
    .detail__review {
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.55;
      color: var(--ink-soft);
      margin: 0 0 40px 0;
      text-wrap: pretty;
    }
    .fact-table { border-top: 1px solid var(--ink); margin: 0; }
    .fact-row {
      display: grid;
      grid-template-columns: 42% 1fr;
      gap: 16px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .fact-row dt,
    .fact-row dd { margin: 0; line-height: 1.4; }
    .fact-row dt {
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .fact-row dd {
      font-family: var(--serif);
      font-size: 16px;
      text-align: right;
    }
    .fact-row a { border-bottom: 1px solid var(--ink-muted); padding-bottom: 1px; }

    /* ─── Gènere (pill) ──────────────────────────────────────── */
    .genre {
      display: inline-block;
      background: var(--ink);
      color: var(--genre, var(--paper));
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1.2;
      padding: 4px 10px 3px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .detail__eyebrow .genre { font-family: var(--sans); font-size: 10.5px; padding: 5px 12px 4px; }

    /* ─── Enllaç a estadístiques ─────────────────────────────── */
    .library__count { display: flex; align-items: center; gap: 10px; }
    .stats-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      border-radius: 50%;
      transition: color 0.2s, border-color 0.2s;
    }
    .stats-link:hover { color: var(--ink); border-color: var(--ink); }

    /* ─── Estadístiques ──────────────────────────────────────── */
    .stats__summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      margin-bottom: 72px;
    }
    .stat { border-top: 1px solid var(--ink); padding-top: 14px; }
    .stat__n { font-family: var(--serif); font-size: 52px; font-weight: 300; line-height: 1; }
    .stat__k {
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 10px;
    }
    .stats__cols {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 80px;
      margin-bottom: 72px;
    }
    .stats__h {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 32px;
      line-height: 1.1;
      margin: 0 0 20px 0;
    }
    .stats__empty { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink-muted); margin: 0; }

    .rank { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .rank__row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
      transition: background 0.2s;
    }
    .rank__row:hover { background: var(--paper-deep); }
    .rank__n { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }
    .rank__main { min-width: 0; display: flex; flex-direction: column; }
    .rank__title { font-family: var(--serif); font-size: 18px; font-weight: 500; line-height: 1.2; }
    .rank__author { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink-soft); }
    .rank__side { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .rank__date { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); }

    .bars { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .bar {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 32px;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
    }
    .bar__label { min-width: 0; display: flex; }
    .bar__label .genre { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .bar__none { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); }
    .bar__track { height: 10px; background: var(--paper-deep); }
    .bar__fill { display: block; height: 100%; background: var(--ink); border-right: 4px solid var(--genre, var(--ink-muted)); }
    .bar__n { font-family: var(--serif); font-size: 18px; text-align: right; }

    .year { margin-bottom: 48px; }
    .year__h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--serif);
      font-weight: 300;
      font-size: 40px;
      line-height: 1;
      margin: 0 0 14px 0;
    }
    .year__n { font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); }

    @media (max-width: 820px) {
      .stats__summary { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 48px; }
      .stat__n { font-size: 40px; }
      .stats__cols { grid-template-columns: 1fr; gap: 48px; margin-bottom: 48px; }
      .stats__h { font-size: 26px; }
      .rank__row { grid-template-columns: 26px minmax(0, 1fr); }
      .rank__side { grid-column: 2; }
      .bar { grid-template-columns: 130px minmax(0, 1fr) 28px; gap: 12px; }
    }

    /* ─── Footer ─────────────────────────────────────────────── */
    .site-footer {
      border-top: 1px solid var(--rule);
      margin-top: 96px;
      padding: 40px;
    }
    .site-footer__inner {
      max-width: 1320px;
      margin: 0 auto;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 1080px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .site-header__inner { padding: 14px 20px; gap: 12px; }
      .site-header__nav { gap: 16px; font-size: 10px; letter-spacing: 0.14em; }
      .logo__mark { width: 32px; height: 32px; }
      .logo__name { font-size: 16px; }

      .status { padding: 80px 20px; }
      .library { padding: 24px 20px 0; }
      .search input { font-size: 20px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 20px; }

      .detail { padding: 32px 20px 80px; }
      .detail__back { margin-bottom: 32px; }
      .detail__header {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 32px;
        padding-bottom: 24px;
      }
      .detail__year { font-size: 36px; }
      .detail__body { grid-template-columns: 1fr; gap: 40px; }
      .detail__cover { max-width: 280px; }
      .detail__review { font-size: 18px; }
      .fact-row { grid-template-columns: 1fr; gap: 4px; }
      .fact-row dd { text-align: left; }

      .site-footer { padding: 24px 20px; margin-top: 64px; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px; }
      .logo__name { font-size: 15px; }
      .book__title { font-size: 17px; }
      .book__author { font-size: 14px; }
      .no-cover__title { font-size: 16px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a href="#/" class="logo" aria-label="Col·lecció Ortín-Escudé — llibres">
      <svg class="logo__mark" viewBox="0 0 80 80" aria-hidden="true">
        <rect x="6" y="6" width="68" height="68" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
        <rect x="12" y="12" width="56" height="56" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.55"></rect>
        <text x="40" y="50.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="500" fill="currentColor" letter-spacing="-0.5">OE</text>
        <line x1="35" y1="58" x2="45" y2="58" stroke="currentColor" stroke-width="0.8"></line>
      </svg>
      <span class="logo__name">Col·lecció Ortín-Escudé</span>
    </a>
    <nav class="site-header__nav">
      <a href="../art/">Obres</a>
      <a href="#/" class="is-active">Llibres</a>
    </nav>
  </div>
</header>

<main id="app">
  <div class="status">Carregant la biblioteca…</div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">© Col·lecció Ortín-Escudé</div>
</footer>

<script src="sample-data.js"></script>
<script>
  // ─── Configuració ──────────────────────────────────────────
  // Buit (o ?sample a l'URL) = es fan servir les dades de prova de sample-data.js
  const SHEET_ID = '1fit_6o9YVrx1t2iHjHtjE3bpswkViEQlDCq2oA6QgcA';
  const USE_SAMPLE = !SHEET_ID || new URLSearchParams(location.search).has('sample');
  // Una pestanya per propietari; el nom de la pestanya és l'id del propietari.
  // Es llegeix per gid (no per nom): amb un nom inexistent gviz retorna la primera pestanya sense avisar.
  const TABS = [
    { owner: 'Ortín',  gid: '1772033601' },
    { owner: 'Escudé', gid: '2113165591' }
  ];
  const PAGE_SIZE = 10;
  // Exportació CSV (no gviz): retorna cada cel·la tal com es veu al full. gviz endevina un tipus
  // per columna i buida les cel·les que no hi encaixen (p. ex. una valoració "4" en una columna de dates).
  const sheetUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${tab.gid}`;

  // Capçaleres del full → claus internes. Nota no es mostra mai.
  const FIELD_MAP = {
    'ISBN': 'isbn',
    'Títol': 'titol', 'Titol': 'titol',
    'Autors': 'autors', 'Autor': 'autors',
    'Portada': 'portada',
    'Any compra': 'anyCompra',
    'Estat': 'estat',
    'Valoració': 'valoracio', 'Valoracio': 'valoracio',
    'Editorial': 'editorial',
    'Any publicació': 'anyPublicacio', 'Any publicacio': 'anyPublicacio',
    'Idioma': 'idioma',
    'Gènere': 'genere', 'Genere': 'genere',
    'Ressenya': 'ressenya',
    'Data lectura': 'dataLectura', 'Data de lectura': 'dataLectura'
  };
  // Les capçaleres es comparen sense majúscules ni accents ("Data Lectura" = "Data lectura")
  const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const FIELD_LOOKUP = Object.fromEntries(Object.entries(FIELD_MAP).map(([h, k]) => [fold(h), k]));
  const ESTATS = { llegit: 'Llegit', llegint: 'Llegint', pendent: 'Pendent' };

  const app = document.getElementById('app');
  let books = [];
  // Estat de la llista per restaurar-lo en tornar del detall
  const listState = { q: '', shown: PAGE_SIZE, scroll: 0 };
  let results = [];
  let observer = null;

  // ─── Utilitats ─────────────────────────────────────────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const llibres = n => `${n} ${n === 1 ? 'llibre' : 'llibres'}`;
  const slugify = s => fold(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  function clean(v) {
    if (v === null || v === undefined) return '';
    return String(v).trim();
  }

  function parseRating(v) {
    const n = parseFloat(String(v).replace(',', '.'));
    if (isNaN(n)) return null;
    return Math.min(5, Math.max(0, Math.round(n * 2) / 2));
  }

  // Data lectura → 'AAAA-MM-DD', o només 'AAAA' si al full hi ha només l'any.
  // Accepta dates de gviz ("Date(2026,2,14)", mes 0-11), text ISO (2026-03-14),
  // format català (14/03/2026) o un any sol (2026).
  function parseDate(v) {
    const pad = n => String(n).padStart(2, '0');
    let m = v.match(/^(\d{4})(\.0+)?$/);
    if (m) return m[1];
    m = v.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
    if (m) return `${m[1]}-${pad(+m[2] + 1)}-${pad(m[3])}`;
    m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return '';
  }
  const formatDate = iso => iso.split('-').reverse().join('/');

  // Color per gènere: cada gènere comença pel to que li toca pel hash del nom i, si ja és agafat,
  // passa al següent lliure. Així no es repeteixen colors (fins a 12 gèneres) i són estables.
  const GENRE_HUES = [25, 55, 85, 115, 145, 175, 205, 235, 265, 295, 325, 355];
  const genreHue = {};
  function assignGenreColors(list) {
    const used = new Set();
    [...new Set(list.map(b => fold(b.genere)).filter(Boolean))].sort().forEach(g => {
      let h = 0;
      for (const c of g) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      let i = h % GENRE_HUES.length;
      for (let n = 0; n < GENRE_HUES.length && used.has(i); n++) i = (i + 1) % GENRE_HUES.length;
      used.add(i);
      genreHue[g] = GENRE_HUES[i];
    });
  }
  const genreColor = g => `oklch(0.84 0.12 ${genreHue[fold(g)] ?? 0})`;
  const genreHtml = b => b.genere
    ? `<span class="genre" style="--genre:${genreColor(b.genere)}">${esc(b.genere)}</span>` : '';

  // URLs candidates per a la portada, per ordre: Portada del full → Open Library per ISBN.
  // Els enllaços de Google Drive (/file/d/<ID>, ?id=<ID>) es converteixen a miniatura.
  function coverUrls(b, size) {
    const urls = [];
    const p = b.portada;
    if (/^https?:\/\//i.test(p)) {
      if (/drive\.google\.com/.test(p)) {
        const id = (p.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/) || []).slice(1).find(Boolean);
        if (id) urls.push(`https://drive.google.com/thumbnail?id=${id}&sz=w1000`);
      } else {
        urls.push(p);
      }
    }
    if (b.isbn) urls.push(`https://covers.openlibrary.org/b/isbn/${b.isbn}-${size}.jpg?default=false`);
    return urls;
  }

  const placeholder = b => `
    <div class="no-cover no-cover--${b.index % 5}">
      <div>
        <div class="no-cover__title">${esc(b.titol)}</div>
        <div class="no-cover__author">${esc(b.autors)}</div>
      </div>
      <div class="no-cover__label">Portada no disponible</div>
    </div>`;

  function coverHtml(b, size) {
    const urls = coverUrls(b, size);
    if (!urls.length) return placeholder(b);
    return `<img src="${esc(urls[0])}" alt="Portada de ${esc(b.titol)}" loading="${size === 'L' ? 'eager' : 'lazy'}" decoding="async" referrerpolicy="no-referrer" data-i="${b.index}" data-size="${size}" data-try="0">`;
  }

  // Si una portada falla, prova la següent URL; si no n'hi ha cap més, posa el placeholder.
  document.addEventListener('error', e => {
    const img = e.target;
    if (img.tagName !== 'IMG' || !img.dataset.i) return;
    const b = books[img.dataset.i];
    const urls = coverUrls(b, img.dataset.size);
    const next = Number(img.dataset.try) + 1;
    if (next < urls.length) {
      img.dataset.try = next;
      img.src = urls[next];
    } else {
      img.outerHTML = placeholder(b);
    }
  }, true);

  function badgeHtml(b) {
    return b.estat ? `<span class="badge badge--${b.estat.toLowerCase()}">${b.estat}</span>` : '';
  }

  function starsHtml(b) {
    if (b.estat !== 'Llegit' || b.valoracio === null) return '';
    const label = String(b.valoracio).replace('.', ',');
    return `<span class="stars" role="img" aria-label="Valoració ${label} de 5">★★★★★<span class="stars__fill" style="width:${b.valoracio * 20}%">★★★★★</span></span>`;
  }

  // ─── Dades ─────────────────────────────────────────────────
  // CSV → llista de files (camps entre cometes poden contenir comes, cometes dobles i salts de línia)
  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  async function loadTab(tab) {
    if (USE_SAMPLE) return (window.SAMPLE_BOOKS || {})[tab.owner] || [];
    const res = await fetch(sheetUrl(tab));
    if (!res.ok) throw new Error(`No s'ha pogut llegir la pestanya ${tab.owner} (${res.status})`);
    const [headers = [], ...rows] = parseCsv(await res.text());
    return rows.map(cells => {
      const obj = {};
      cells.forEach((v, i) => { if (headers[i] && headers[i].trim()) obj[headers[i].trim()] = v; });
      return obj;
    });
  }

  async function loadBooks() {
    const tabs = await Promise.all(TABS.map(loadTab));
    const used = new Set();
    const list = [];

    tabs.forEach((rows, t) => {
      const owner = TABS[t].owner;
      rows.forEach(row => {
        const o = {};
        Object.entries(row).forEach(([h, v]) => {
          const key = FIELD_LOOKUP[fold(String(h).trim())];
          if (key) o[key] = clean(v);
        });
        if (!o.titol && !o.isbn) return;

        const isbn = (o.isbn || '').replace(/[^0-9Xx]/g, '').toUpperCase();
        const titol = o.titol || 'Sense títol';
        let id = `${slugify(owner)}-${isbn || slugify(titol) || list.length + 1}`;
        if (used.has(id)) { let n = 2; while (used.has(`${id}-${n}`)) n++; id = `${id}-${n}`; }
        used.add(id);

        const book = {
          ...o,
          id,
          owner,
          isbn,
          titol,
          autors: (o.autors || '').split(';').map(s => s.trim()).filter(Boolean).join(', ') || 'Autor desconegut',
          estat: ESTATS[fold(o.estat)] || '',
          valoracio: o.valoracio ? parseRating(o.valoracio) : null,
          dataLectura: parseDate(o.dataLectura || ''),
          order: list.length
        };
        book.haystack = fold([book.titol, book.autors, book.isbn, o.isbn, book.editorial, book.genere].join(' '));
        list.push(book);
      });
    });

    // Llegint primer; després per any de compra (més recent primer, sense any al final); empat → ordre del full
    list.sort((a, b) =>
      (b.estat === 'Llegint') - (a.estat === 'Llegint') ||
      (Number(b.anyCompra) || -Infinity) - (Number(a.anyCompra) || -Infinity) ||
      a.order - b.order);
    list.forEach((b, i) => { b.index = i; });
    assignGenreColors(list);
    return list;
  }

  function search(q) {
    const words = fold(q).split(/\s+/).filter(Boolean)
      .map(w => /^[\d-]+x?$/.test(w) ? w.replace(/-/g, '') : w);
    if (!words.length) return books;
    return books.filter(b => words.every(w => b.haystack.includes(w)));
  }

  // ─── Vistes ────────────────────────────────────────────────
  function bookCard(b) {
    return `
      <a class="book" href="#/llibre/${encodeURIComponent(b.id)}" aria-label="${esc(b.titol)}, de ${esc(b.autors)}">
        <div class="book__cover">${coverHtml(b, 'M')}</div>
        <div>
          <h2 class="book__title">${esc(b.titol)}</h2>
          <p class="book__author">${esc(b.autors)}</p>
          <div class="book__meta">${genreHtml(b)}${badgeHtml(b)}</div>
          ${starsHtml(b) ? `<div class="book__rating">${starsHtml(b)}</div>` : ''}
        </div>
      </a>`;
  }

  function renderLibrary(restore) {
    document.title = 'Llibres — Col·lecció Ortín-Escudé';
    app.innerHTML = `
      <section class="library">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M13.5 13.5L19 19" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          <input type="search" id="q" placeholder="Cerca per títol, autor, ISBN…" autocomplete="off" aria-label="Cerca llibres" value="${esc(listState.q)}">
          <button type="button" class="link-btn" id="clear"${listState.q ? '' : ' hidden'}>Neteja</button>
        </label>
        <p class="library__count" id="count"></p>
        <div id="results"></div>
      </section>`;

    const input = document.getElementById('q');
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => setQuery(input.value), 200);
    });
    document.getElementById('clear').addEventListener('click', () => {
      input.value = '';
      setQuery('');
      input.focus();
    });

    renderResults(restore ? listState.shown : PAGE_SIZE);
    window.scrollTo(0, restore ? listState.scroll : 0);
  }

  function setQuery(q) {
    listState.q = q.trim();
    // Desa la cerca a l'URL sense afegir entrades a l'historial
    history.replaceState(null, '', listState.q ? `#/?q=${encodeURIComponent(listState.q)}` : '#/');
    document.getElementById('clear').hidden = !listState.q;
    // Una cerca nova torna a dalt; si no, el sentinella ja visible carregaria tots els lots
    window.scrollTo(0, 0);
    renderResults(PAGE_SIZE);
  }

  function renderResults(shown) {
    results = search(listState.q);
    listState.shown = Math.min(shown, results.length);
    const box = document.getElementById('results');

    const count = listState.q ? `${results.length} de ${llibres(books.length)}` : llibres(books.length);
    document.getElementById('count').innerHTML = `
      ${count}
      <a class="stats-link" href="#/estadistiques" title="Estadístiques" aria-label="Estadístiques">
        <svg width="14" height="12" viewBox="0 0 14 12" fill="none" aria-hidden="true">
          <path d="M1 11.5h12M3 9.5V6M7 9.5V1.5M11 9.5V4" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </a>`;

    if (!results.length) {
      box.innerHTML = `
        <div class="empty">
          <span>Cap llibre coincideix amb «${esc(listState.q)}»</span>
          <button type="button" class="link-btn" id="clearEmpty">Neteja la cerca</button>
        </div>`;
      document.getElementById('clearEmpty').addEventListener('click', () => {
        document.getElementById('q').value = '';
        setQuery('');
      });
      return;
    }

    box.innerHTML = `
      <div class="grid" id="grid">${results.slice(0, listState.shown).map(bookCard).join('')}</div>
      <div class="sentinel" id="sentinel"></div>
      <div class="more" id="more"></div>`;
    updateMore();
    watchSentinel();
  }

  function loadMore() {
    if (listState.shown >= results.length) return;
    const next = results.slice(listState.shown, listState.shown + PAGE_SIZE);
    document.getElementById('grid').insertAdjacentHTML('beforeend', next.map(bookCard).join(''));
    listState.shown += next.length;
    updateMore();
  }

  function updateMore() {
    const more = document.getElementById('more');
    if (listState.shown < results.length) {
      more.innerHTML = `<button type="button" class="link-btn" id="moreBtn">Carrega'n més · ${listState.shown} de ${results.length}</button>`;
      document.getElementById('moreBtn').addEventListener('click', loadMore);
    } else {
      more.innerHTML = `<span class="more__end">Has arribat al final · ${llibres(results.length)}</span>`;
    }
  }

  // Carrega el següent lot quan el final de la graella s'apropa a la pantalla
  function watchSentinel() {
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const sentinel = document.getElementById('sentinel');
    observer = new IntersectionObserver(entries => {
      if (!entries[0].isIntersecting) return;
      loadMore();
      // Si després d'afegir el lot el sentinella continua visible, l'observer no torna a disparar
      requestAnimationFrame(() => {
        if (sentinel.getBoundingClientRect().top < window.innerHeight + 400) {
          observer.unobserve(sentinel);
          if (listState.shown < results.length) observer.observe(sentinel);
        }
      });
    }, { rootMargin: '0px 0px 400px 0px' });
    observer.observe(sentinel);
  }

  function renderDetail(b) {
    document.title = `${b.titol} — Col·lecció Ortín-Escudé`;
    const back = listState.q ? `#/?q=${encodeURIComponent(listState.q)}` : '#/';
    const rows = [
      ['Autors', esc(b.autors)],
      ['Editorial', esc(b.editorial)],
      ['Any de publicació', esc(b.anyPublicacio)],
      ['Idioma', esc(b.idioma)],
      ['Gènere', esc(b.genere)],
      ['ISBN', b.isbn ? `${esc(b.isbn)} · <a href="https://openlibrary.org/isbn/${esc(b.isbn)}" target="_blank" rel="noopener">Open Library ↗</a>` : ''],
      ['Any de compra', esc(b.anyCompra)],
      ['Data de lectura', b.dataLectura ? formatDate(b.dataLectura) : ''],
      ['Propietat', esc(b.owner)]
    ].filter(([, v]) => v);

    app.innerHTML = `
      <section class="detail">
        <a class="detail__back" href="${back}">
          <svg width="18" height="10" viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M18 5H2M6 1L2 5l4 4" stroke="currentColor" stroke-width="1"></path>
          </svg>
          Tornar a la biblioteca
        </a>
        <header class="detail__header">
          <div>
            ${b.genere ? `<p class="detail__eyebrow">${genreHtml(b)}</p>` : ''}
            <h1 class="detail__title">${esc(b.titol)}</h1>
            <p class="detail__author">${esc(b.autors)}</p>
          </div>
          ${b.anyPublicacio ? `<div class="detail__year">${esc(b.anyPublicacio)}</div>` : ''}
        </header>
        <div class="detail__body">
          <div class="detail__cover">${coverHtml(b, 'L')}</div>
          <div>
            ${b.estat ? `<div class="detail__status">${badgeHtml(b)}${starsHtml(b)}</div>` : ''}
            ${b.ressenya ? `<p class="detail__review">${esc(b.ressenya)}</p>` : ''}
            <dl class="fact-table">
              ${rows.map(([k, v]) => `<div class="fact-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
            </dl>
          </div>
        </div>
      </section>`;
    window.scrollTo(0, 0);
  }

  function rankRow(b, n, side) {
    return `
      <li>
        <a class="rank__row" href="#/llibre/${encodeURIComponent(b.id)}">
          <span class="rank__n">${String(n).padStart(2, '0')}</span>
          <span class="rank__main">
            <span class="rank__title">${esc(b.titol)}</span>
            <span class="rank__author">${esc(b.autors)}</span>
          </span>
          <span class="rank__side">${side}</span>
        </a>
      </li>`;
  }

  function renderStats() {
    document.title = 'Estadístiques — Llibres — Col·lecció Ortín-Escudé';
    const back = listState.q ? `#/?q=${encodeURIComponent(listState.q)}` : '#/';
    const byEstat = e => books.filter(b => b.estat === e).length;

    // Millor valorats: llegits amb valoració; empat → llegit més recent
    const top = books
      .filter(b => b.estat === 'Llegit' && b.valoracio !== null)
      .sort((a, b) => b.valoracio - a.valoracio || b.dataLectura.localeCompare(a.dataLectura) || a.titol.localeCompare(b.titol))
      .slice(0, 10);

    // Llegits per any (segons Data lectura), els 10 més recents de cada any
    const years = {};
    books.filter(b => b.dataLectura).forEach(b => (years[b.dataLectura.slice(0, 4)] ??= []).push(b));
    const yearKeys = Object.keys(years).sort().reverse();

    // Total per gènere
    const genres = {};
    books.forEach(b => { const g = b.genere || ''; genres[g] = (genres[g] || 0) + 1; });
    const genreList = Object.entries(genres).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const maxGenre = Math.max(1, ...genreList.map(([, n]) => n));

    app.innerHTML = `
      <section class="detail stats">
        <a class="detail__back" href="${back}">
          <svg width="18" height="10" viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M18 5H2M6 1L2 5l4 4" stroke="currentColor" stroke-width="1"></path>
          </svg>
          Tornar a la biblioteca
        </a>
        <header class="detail__header">
          <div>
            <p class="detail__eyebrow">Biblioteca</p>
            <h1 class="detail__title">Estadístiques</h1>
          </div>
        </header>

        <div class="stats__summary">
          ${[['Llibres', books.length], ['Llegits', byEstat('Llegit')], ['Llegint', byEstat('Llegint')], ['Pendents', byEstat('Pendent')]]
            .map(([k, v]) => `<div class="stat"><div class="stat__n">${v}</div><div class="stat__k">${k}</div></div>`).join('')}
        </div>

        <div class="stats__cols">
          <section>
            <h2 class="stats__h">Millor valorats</h2>
            ${top.length
              ? `<ol class="rank">${top.map((b, i) => rankRow(b, i + 1, starsHtml(b))).join('')}</ol>`
              : `<p class="stats__empty">Encara no hi ha cap llibre llegit amb valoració.</p>`}
          </section>
          <section>
            <h2 class="stats__h">Per gènere</h2>
            <ul class="bars">
              ${genreList.map(([g, n]) => `
                <li class="bar">
                  <span class="bar__label">${g ? genreHtml({ genere: g }) : '<span class="bar__none">Sense gènere</span>'}</span>
                  <span class="bar__track"><span class="bar__fill" style="width:${n / maxGenre * 100}%;${g ? `--genre:${genreColor(g)}` : ''}"></span></span>
                  <span class="bar__n">${n}</span>
                </li>`).join('')}
            </ul>
          </section>
        </div>

        <section class="stats__years">
          <h2 class="stats__h">Llegits per any</h2>
          ${yearKeys.length ? yearKeys.map(y => {
            const list = years[y].sort((a, b) => b.dataLectura.localeCompare(a.dataLectura));
            return `
              <div class="year">
                <h3 class="year__h"><span>${y}</span><span class="year__n">${llibres(list.length)}${list.length > 10 ? ' · els 10 últims' : ''}</span></h3>
                <ol class="rank">${list.slice(0, 10).map((b, i) => rankRow(b, i + 1, `${starsHtml(b)}<span class="rank__date">${formatDate(b.dataLectura)}</span>`)).join('')}</ol>
              </div>`;
          }).join('') : `<p class="stats__empty">Encara no hi ha cap llibre amb Data lectura.</p>`}
        </section>
      </section>`;
    window.scrollTo(0, 0);
  }

  // ─── Router ────────────────────────────────────────────────
  // awayFromList: s'ha sortit de la llista (detall o estadístiques) i cal restaurar-la en tornar
  let awayFromList = false;
  function leaveList() {
    if (!awayFromList) listState.scroll = window.scrollY;
    if (observer) observer.disconnect();
    awayFromList = true;
  }

  function route() {
    if (location.hash === '#/estadistiques') {
      leaveList();
      return renderStats();
    }
    const m = location.hash.match(/^#\/llibre\/(.+)$/);
    if (m) {
      const b = books.find(x => x.id === decodeURIComponent(m[1]));
      if (!b) return location.replace('#/');
      leaveList();
      return renderDetail(b);
    }
    const q = new URLSearchParams(location.hash.split('?')[1] || '').get('q') || '';
    // Tornant del detall o de les estadístiques amb la mateixa cerca → restaura els llibres carregats i el scroll
    const restore = awayFromList && q === listState.q;
    if (!restore) listState.q = q;
    awayFromList = false;
    renderLibrary(restore);
  }

  window.addEventListener('hashchange', route);

  loadBooks()
    .then(data => { books = data; route(); })
    .catch(err => {
      console.error('Error carregant el full:', err);
      app.innerHTML = `<div class="status">No s'ha pogut carregar la biblioteca. Torna-ho a provar més tard.</div>`;
    });
</script>

</body>
</html>
